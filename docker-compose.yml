services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      PORT: 8000
      MONGODB_URL: mongodb://mongodb:27017/grocecart
      CORS_ORIGIN: http://localhost,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
